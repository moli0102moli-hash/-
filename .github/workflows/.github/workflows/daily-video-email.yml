name: Daily video email

on:
  push:
      branches: [main]
        schedule:
            - cron: "0 8 * * *"
              workflow_dispatch:

              jobs:
                send-video:
                    runs-on: ubuntu-latest
                        steps:
                              - name: Check out repository
                                      uses: actions/checkout@v4

                                            - name: Set up Python
                                                    uses: actions/setup-python@v5
                                                            with:
                                                                      python-version: "3.11"

                                                                            - name: Install ffmpeg
                                                                                    run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk

                                                                                          - name: Install Python dependencies
                                                                                                  run: python -m pip install -r requirements.txt

                                                                                                        - name: Generate today's video (no email yet)
                                                                                                                run: python daily_video_sender.py --no-email
                                                                                                                
                                                                                                                      - name: Upload video artifact
                                                                                                                              uses: actions/upload-artifact@v4
                                                                                                                                      with:
                                                                                                                                                name: daily-video-${{ github.run_id }}
                                                                                                                                                          path: out/*.mp4
                                                                                                                                                                    if-no-files-found: error
                                                                                                                                                                              retention-days: 14
                                                                                                                                                                              
